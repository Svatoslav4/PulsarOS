
name: PULSAR Backend CD

on:
  workflow_run:
    workflows: ["PULSAR Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pulsar-backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret"
            exit 1
          fi

          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator="&" ;;
            *) separator="?" ;;
          esac

          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${COMMIT_SHA}"

          echo "Render deployment triggered for ${COMMIT_SHA}"
